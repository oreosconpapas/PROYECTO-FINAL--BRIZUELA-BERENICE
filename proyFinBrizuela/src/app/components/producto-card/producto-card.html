<div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
  @if (animal.imagen) {
    <img [src]="animal.imagen" class="card-img-top" [alt]="animal.nombre" style="height: 200px; object-fit: cover;">
  }
  
  <div class="card-body d-flex flex-column text-center p-4">
    <span class="badge bg-success bg-opacity-10 text-success mb-2 align-self-center px-3 py-1 rounded-pill">{{ animal.especie }}</span>
    
    <h5 class="card-title fw-bold text-dark mb-2">{{ animal.nombre }}</h5>
    
    <p class="card-text text-secondary small mb-4">{{ animal.descripcion }}</p>
    
    <button class="btn btn-outline-success mt-auto btn-sm rounded-pill py-2" (click)="onVerDetalle()">
      🔍 Ver detalle
    </button>
  </div>
</div>
